language: es
prefix: "&8[&5EmsiChill&8] "

modules:
  homes: true
  authentication: true
  skins: true
  teleport: true
  player-info: true
  staff: true
  regions: true
  graves: true
  social: true
  resource-packs: false

audit-log:
  enabled: false

updates:
  enabled: true
  repository: Jme-05/EmsiChill
  timeout-seconds: 6
  ignored-version: ""
  staged-version: ""
  automatic:
    enabled: true
    interval-minutes: 30
    check-on-admin-join: true
    join-cache-max-age-seconds: 60
    notify-console: true
    notify-admins: true
  install:
    # Mantén la instalación apagada salvo que confíes plenamente en el repositorio configurado.
    enabled: false
    # El feed solo sirve para avisos; instalar requiere tamaño y SHA-256 de la API de GitHub.
    allow-feed-fallback: false
    timeout-seconds: 60
    max-download-megabytes: 25
  paper:
    # Checks for new Paper/Minecraft builds using PaperMC's official downloads service.
    enabled: true
    project: paper
    timeout-seconds: 8
    user-agent: "EmsiChill/${version} (https://github.com/Jme-05/EmsiChill)"
    # false = STABLE builds only. true = allows BETA/experimental builds too.
    include-experimental-builds: false
    # How many recent Minecraft versions to scan when the newest one has no acceptable build yet.
    max-version-search: 12
    ignored-build: ""
    staged-build: ""
    automatic:
      enabled: true
      interval-minutes: 30
      check-on-admin-join: true
      join-cache-max-age-seconds: 60
      notify-console: true
      notify-admins: true
    download:
      # Downloads paper-*.jar into this folder. It does not replace the running server jar.
      enabled: true
      directory: server-updates
      timeout-seconds: 180
      max-download-megabytes: 120
      keep-old-downloads: false
