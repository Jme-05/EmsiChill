_meta:
  config-version: 5

# Put .zip files or unpacked pack folders directly inside plugins/EmsiChill/ResourcePacks/.
# Every source must contain pack.mcmeta. Packs stay independent and are sent alphabetically.
# Prefix names with 01-, 02-, and so on when their order matters.
# Run /emsichill rp reload after changing this file or a pack source.
# Use /emsichill rp push only to update online players immediately.

# Send packs before the world appears so Minecraft applies them during the connection screen.
send-during-configuration: true

# Fallback delay used only when the connection-stage API is unavailable or disabled.
send-delay-ticks: 20

# Keep this false for a quieter join. Enable only if another plugin leaves conflicting server packs active.
clear-existing: false

# Successful cache/download states stay quiet. Failures are always logged.
log-status: false

pack:
  # Players who decline a required pack are disconnected by Minecraft.
  required: true
  # Leave blank for Minecraft's compact default prompt.
  prompt: ""
  # Protects the server from oversized folders and malicious compressed files.
  maximum-uncompressed-megabytes: 512

hosting:
  enabled: true

  # local: serves packs from this Minecraft server and requires the port below to be public.
  # remote: uploads generated packs to MCPacks over HTTPS; no extra server port is required.
  # auto: tries local hosting first and uses MCPacks only when the local port cannot be opened.
  # remote and auto may publish your generated pack files to a third-party service.
  mode: "auto"

  # These settings apply to local and auto hosting.
  bind-address: "0.0.0.0"
  port: 8165
  # auto here means the hostname used by the player, not hosting.mode: auto.
  public-base-url: "auto"

  # These settings apply to remote hosting and the remote fallback in auto mode.
  remote:
    api-base-url: "https://mcpacks.dev/api/v1/"
    timeout-seconds: 180
    maximum-upload-megabytes: 250
