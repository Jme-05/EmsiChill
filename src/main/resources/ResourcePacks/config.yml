# Use /emsichill reload to apply changes.
# This module only sends packs on join. Minecraft requires direct .zip URLs.

# Wait 2 seconds after the player joins before sending packs.
send-delay-ticks: 40

# If another plugin sent packs first, EmsiChill can clear them before sending its own.
clear-existing: false

# Logs whether the player accepts, downloads, loads, rejects or fails each pack.
log-status: true

# When enabled, EmsiChill does not resend packs the player already loaded with the same SHA-1.
# Warning: if a pack is not resent, Minecraft may not activate it on the new connection.
# Keep this false if you want packs to remain active every time a player joins.
send-only-new-or-changed: false

# Define one or more packs. Each sha1 must be the SHA-1 hash of the final .zip file.
# Windows: Get-FileHash "C:\path\resource-pack.zip" -Algorithm SHA1
packs: []

# Example:
# packs:
#   - id: main
#     enabled: true
#     name: "Server Pack"
#     url: "https://example.com/resource-pack.zip"
#     sha1: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
#     required: false
#     prompt: "This server uses a custom resource pack."
