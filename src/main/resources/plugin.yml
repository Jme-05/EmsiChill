name: ${name}
api-version: '26.2'
description: ${description}
author: ${author}
main: ${mainClass}
version: ${version}
commands:
  skin:
    description: Changes and saves player skins
    usage: /skin <name|random|reset>
    aliases: [skins]
    permission: emsichill.skin
  skull:
    description: Gives the head of a premium account
    usage: /skull <name>
    permission: emsichill.skull
  login:
    description: Logs into the server
    usage: /login <password>
    aliases: [l]
  register:
    description: Registers an account
    usage: /register <password> <password>
    aliases: [reg]
  changepassword:
    description: Changes the account password
    usage: /changepassword <current> <new> <new>
    aliases: [changepass]
  unregister:
    description: Removes the account registration
    usage: /unregister <password>
  auth:
    description: Authentication administration
    usage: /auth <unregister|changepassword|reload>
    permission: emsichill.auth.admin
  emsichill:
    description: EmsiChill help and settings
    usage: /emsichill help [category]
    aliases: [emsi]
  home:
    description: Teleports you to one of your homes
    usage: /home [name]
    permission: emsichill.home
  sethome:
    description: Saves a home
    usage: /sethome [name]
    permission: emsichill.sethome
  delhome:
    description: Deletes a home
    usage: /delhome <name>
    permission: emsichill.delhome
  homes:
    description: Lists your homes
    usage: /homes
    permission: emsichill.home
  tpa:
    description: Requests a teleport to another player
    usage: /tpa <player>
    permission: emsichill.tpa
  tpahere:
    description: Requests another player to teleport to you
    usage: /tpahere <player>
    permission: emsichill.tpa
  tpaccept:
    description: Accepts a teleport request
    permission: emsichill.tpa
    usage: /tpaccept
  tpdeny:
    description: Denies a teleport request
    permission: emsichill.tpa
    usage: /tpdeny
  tpcancel:
    description: Cancels a sent teleport request
    permission: emsichill.tpa
    usage: /tpcancel
  tptoggle:
    description: Toggles teleport requests
    permission: emsichill.tpa
    usage: /tptoggle
  back:
    description: Returns to your previous location
    usage: /back
    permission: emsichill.back
  rtp:
    description: Safe random teleport
    permission: emsichill.rtp
    usage: /rtp
  playtime:
    description: Shows playtime
    usage: /playtime [player]
    permission: emsichill.playtime
  playtimetop:
    description: Shows the playtime leaderboard
    usage: /playtimetop
    permission: emsichill.playtime
  seen:
    description: Shows a player's last seen time
    usage: /seen [player]
    permission: emsichill.seen
  staffchat:
    description: Private staff chat
    usage: /staffchat <message|toggle>
    aliases: [sc]
    permission: emsichill.staffchat
  vanish:
    description: Hides a moderator
    usage: /vanish [player]
    permission: emsichill.vanish
  vanishlist:
    description: Lists vanished players
    usage: /vanishlist
    permission: emsichill.vanish.see
  staffmode:
    description: Toggles moderation tools
    usage: /staffmode [player]
    permission: emsichill.staffmode
    aliases: [mod]
  invsee:
    description: Opens a player's inventory, armor and offhand
    usage: /invsee [player]
    permission: emsichill.invsee.view
  enderchestsee:
    description: Opens a player's Ender Chest
    usage: /enderchestsee [player]
    aliases: [ecsee]
    permission: emsichill.enderchestsee.view
  freeze:
    description: Freezes, unfreezes or applies a timed freeze
    usage: /freeze <player> [seconds]
    permission: emsichill.freeze
  mute:
    description: Permanently or temporarily mutes a player
    usage: /mute <player> [time]
    permission: emsichill.mute
  unmute:
    description: Removes an active mute
    usage: /unmute <player>
    permission: emsichill.unmute
  warn:
    description: Records a warning with its reason
    usage: /warn <player> <reason>
    permission: emsichill.warn
  warnings:
    description: Shows a player's moderation history
    usage: /warnings <player>
    permission: emsichill.warnings
  region:
    description: Land claims and protection
    usage: /region <claim|build|teleport|view|upgrade|settings|add|owner|delete>
    permission: emsichill.region.use
  grave:
    description: Administrative grave management
    usage: /grave <list|locate|recover> [player|id]
    aliases: [graves]
    permission: emsichill.grave.admin
  deathcontrol:
    description: Administrative inventory-loss control
    usage: /deathcontrol <player|default> <grave|keep|drop>
    permission: emsichill.deathcontrol.admin
  sit:
    description: Lets you sit using a native pose
    usage: /sit
    permission: emsichill.pose
  crawl:
    description: Lets you crawl on the ground
    usage: /crawl
    permission: emsichill.pose
  stand:
    description: Resets your pose
    usage: /stand
    permission: emsichill.pose
  whereami:
    description: Shares your dimension and coordinates in chat
    usage: /whereami
    permission: emsichill.whereami
permissions:
  emsichill.skin:
    description: Allows using /skin
    default: true
  emsichill.skull:
    description: Allows getting heads with /skull
    default: true
  emsichill.skin.others:
    description: Allows changing other players' skins
    default: op
  emsichill.skin.bypasscooldown:
    description: Bypasses the skin change cooldown
    default: op
  emsichill.auth.admin:
    description: Allows account administration with /auth
    default: op
  emsichill.admin.reload:
    description: Allows reloading EmsiChill
    default: op
  emsichill.admin.language:
    description: Allows changing the global fallback EmsiChill language from console/admin tools
    default: op
  emsichill.admin.maintenance:
    description: Allows diagnosing, backing up and migrating EmsiChill data
    default: op
  emsichill.admin.update:
    description: Allows checking, ignoring and preparing new EmsiChill releases and Paper builds
    default: op
  emsichill.resourcepack.admin:
    description: Allows rebuilding and sending local server resource packs
    default: op
  emsichill.home:
    description: Allows using /home and /homes
    default: true
  emsichill.sethome:
    description: Allows saving homes with /sethome
    default: true
  emsichill.delhome:
    description: Allows deleting homes with /delhome
    default: true
  emsichill.homes.3:
    description: Raises the personal limit to 3 homes
    default: false
  emsichill.homes.5:
    description: Raises the personal limit to 5 homes
    default: false
  emsichill.homes.unlimited:
    description: Removes the personal home limit
    default: op
  emsichill.homes.admin:
    description: Allows changing the global home limit
    default: op
  emsichill.homes.others:
    description: Allows viewing and using offline players' homes
    default: op
  emsichill.tpa:
    description: Allows using teleport requests
    default: true
  emsichill.back:
    description: Allows returning to the previous location
    default: true
  emsichill.back.others:
    description: Allows running /back on another player
    default: op
  emsichill.rtp:
    description: Allows using random teleport
    default: true
  emsichill.rtp.bypasscooldown:
    description: Bypasses the /rtp cooldown
    default: op
  emsichill.rtp.admin:
    description: Allows changing the /rtp cooldown
    default: op
  emsichill.teleport.bypassdelay:
    description: Bypasses the teleport delay
    default: false
  emsichill.playtime:
    description: Allows checking playtime and leaderboard
    default: true
  emsichill.seen:
    description: Allows checking last seen time
    default: true
  emsichill.staffchat:
    description: Allows using and receiving staff chat
    default: op
  emsichill.vanish:
    description: Allows toggling your own vanish
    default: op
  emsichill.vanish.others:
    description: Allows changing other players' vanish
    default: op
  emsichill.vanish.see:
    description: Allows seeing and listing vanished players
    default: op
  emsichill.staffmode:
    description: Allows toggling your own staff mode
    default: op
  emsichill.staffmode.others:
    description: Allows changing other players' staff mode
    default: op
  emsichill.invsee.view:
    description: Allows opening other inventories in read-only mode
    default: op
  emsichill.invsee.modify:
    description: Allows editing inventories opened through inspection
    default: op
  emsichill.enderchestsee.view:
    description: Allows opening other Ender Chests in read-only mode
    default: op
  emsichill.enderchestsee.modify:
    description: Allows editing Ender Chests opened through inspection
    default: op
  emsichill.freeze:
    description: Allows freezing and unfreezing online players
    default: op
  emsichill.mute:
    description: Allows muting players
    default: op
  emsichill.unmute:
    description: Allows removing active mutes
    default: op
  emsichill.warn:
    description: Allows warning players and recording the reason
    default: op
  emsichill.warnings:
    description: Allows checking moderation histories
    default: op
  emsichill.skin.favorites.unlimited:
    description: Removes the favorite skin limit
    default: op
  emsichill.region.use:
    description: Allows using general region commands
    default: true
  emsichill.region.claim:
    description: Allows claiming land
    default: true
  emsichill.region.admin:
    description: Allows administering any region
    default: op
  emsichill.region.unlimited:
    description: Allows claiming unlimited regions
    default: op
  emsichill.grave.admin:
    description: Allows grave commands and access to other players' graves
    default: op
  emsichill.deathcontrol.admin:
    description: Allows configuring inventory loss
    default: op
  emsichill.pose:
    description: Allows using /sit, /crawl and /stand
    default: true
  emsichill.whereami:
    description: Allows sharing location with /whereami
    default: true

# Single source for README and /emsichill help.
documentation:
  sections:
    players: Player commands
    regions: Region commands
    staff: Staff and moderation commands
    configuration: Administrative configuration commands
  entries:
    - {section: players, category: auth, command: "/register <password> <password>", description: "Registers an account."}
    - {section: players, category: auth, command: "/login <password>", description: "Logs into an account."}
    - {section: players, category: auth, command: "/changepassword <current> <new> <new>", description: "Changes your password."}
    - {section: players, category: auth, command: "/unregister <password>", description: "Removes your own registration."}
    - {section: players, category: skin, command: "/skin <name>", description: "Applies the skin of a premium account."}
    - {section: players, category: skin, command: "/skin random", description: "Applies a random premium skin."}
    - {section: players, category: skin, command: "/skin reset", description: "Resets your skin."}
    - {section: players, category: skin, command: "/skin save <name>", description: "Saves a skin as a favorite."}
    - {section: players, category: skin, command: "/skin unsave <name>", description: "Removes a skin from favorites."}
    - {section: players, category: skin, command: "/skin favorites", description: "Opens the favorite skins menu."}
    - {section: players, category: skin, command: "/skin history", description: "Opens your skin history."}
    - {section: players, category: skin, command: "/skin clearhistory", description: "Clears your own skin history."}
    - {section: players, category: skin, command: "/skull <name>", description: "Gets the head of a premium account."}
    - {section: players, category: teleport, command: "/sethome [name]", description: "Saves a home."}
    - {section: players, category: teleport, command: "/home [name]", description: "Teleports to a home using the configured delay."}
    - {section: players, category: teleport, command: "/delhome <name>", description: "Deletes a home."}
    - {section: players, category: teleport, command: "/homes", description: "Lists your homes."}
    - {section: players, category: teleport, command: "/tpa <player>", description: "Requests a teleport to another player."}
    - {section: players, category: teleport, command: "/tpahere <player>", description: "Requests another player to teleport to you."}
    - {section: players, category: teleport, command: "/tpaccept", description: "Accepts a teleport request."}
    - {section: players, category: teleport, command: "/tpdeny", description: "Denies a teleport request."}
    - {section: players, category: teleport, command: "/tpcancel", description: "Cancels a sent teleport request."}
    - {section: players, category: teleport, command: "/tptoggle", description: "Toggles incoming teleport requests."}
    - {section: players, category: teleport, command: "/back", description: "Returns to your previous location or grave."}
    - {section: players, category: teleport, command: "/rtp", description: "Finds a safe random location."}
    - {section: players, category: social, command: "/playtime [player]", description: "Checks playtime."}
    - {section: players, category: social, command: "/playtimetop", description: "Shows the playtime leaderboard."}
    - {section: players, category: social, command: "/seen [player]", description: "Checks the last seen time."}
    - {section: players, category: social, command: "/sit", description: "Toggles the sitting pose."}
    - {section: players, category: social, command: "/crawl", description: "Toggles the crawling pose."}
    - {section: players, category: social, command: "/stand", description: "Resets your pose."}
    - {section: players, category: social, command: "/whereami", description: "Shares your dimension and coordinates in chat."}
    - {section: players, category: social, command: "/emsichill language <english|spanish>", description: "Changes your personal plugin language."}
    - {section: regions, category: region, command: "/region claim <name>", description: "Claims a region centered on your position."}
    - {section: regions, category: region, command: "/region list", description: "Lists your regions and coordinates."}
    - {section: regions, category: region, command: "/region info [name]", description: "Shows region information."}
    - {section: regions, category: region, command: "/region teleport <name>", description: "Teleports to one of your regions."}
    - {section: regions, category: region, command: "/region view [name]", description: "Temporarily displays region borders."}
    - {section: regions, category: region, command: "/region build", description: "Opens the menu to buy more region slots."}
    - {section: regions, category: region, command: "/region upgrade [name]", description: "Opens the region expansion menu."}
    - {section: regions, category: region, command: "/region settings [name]", description: "Opens region settings."}
    - {section: regions, category: region, command: "/region add <player>", description: "Allows a member to build."}
    - {section: regions, category: region, command: "/region remove <player>", description: "Removes a member."}
    - {section: regions, category: region, command: "/region owner <player>", description: "Adds a co-owner."}
    - {section: regions, category: region, command: "/region unowner <player>", description: "Removes a co-owner."}
    - {section: regions, category: region, command: "/region transfer <player>", description: "Transfers primary ownership."}
    - {section: regions, category: region, command: "/region delete <name> confirm", description: "Permanently deletes a region."}
    - {section: regions, category: region, command: "/region help", description: "Shows region help."}
    - {section: staff, category: staff, command: "/invsee [player]", description: "Opens inventory, armor and offhand. Editing requires an extra permission."}
    - {section: staff, category: staff, command: "/enderchestsee [player]", description: "Opens the Ender Chest. Editing requires an extra permission."}
    - {section: staff, category: staff, command: "/freeze <player> [seconds]", description: "Freezes, unfreezes or applies a timed freeze."}
    - {section: staff, category: staff, command: "/mute <player> [time]", description: "Mutes a player permanently or for 30s, 10m, 2h or 1d."}
    - {section: staff, category: staff, command: "/unmute <player>", description: "Removes an active mute."}
    - {section: staff, category: staff, command: "/warn <player> <reason>", description: "Records a warning with date, moderator and reason."}
    - {section: staff, category: staff, command: "/warnings <player>", description: "Shows the recent moderation history."}
    - {section: staff, category: staff, command: "/staffchat toggle", description: "Toggles staff chat."}
    - {section: staff, category: staff, command: "/staffchat <message>", description: "Sends a message to staff."}
    - {section: staff, category: staff, command: "/vanish [player]", description: "Toggles vanish mode."}
    - {section: staff, category: staff, command: "/vanishlist", description: "Lists vanished players."}
    - {section: staff, category: staff, command: "/staffmode [player]", description: "Toggles moderation tools."}
    - {section: staff, category: staff, command: "/skin <player> <skin>", description: "Changes another player's skin."}
    - {section: staff, category: staff, command: "/home <player> [home]", description: "Lists or uses homes from another player, including offline players."}
    - {section: staff, category: staff, command: "/back <player>", description: "Sends another player to their previous location."}
    - {section: staff, category: staff, command: "/auth unregister <player>", description: "Administratively removes an account registration."}
    - {section: staff, category: staff, command: "/auth changepassword <player> <new>", description: "Administratively changes a password."}
    - {section: staff, category: grave, command: "/grave list", description: "Lists the administrator's active graves."}
    - {section: staff, category: grave, command: "/grave locate <player>", description: "Lists and visually marks graves owned by a player."}
    - {section: staff, category: grave, command: "/grave recover <player>", description: "Recovers all online graves owned by a player."}
    - {section: staff, category: grave, command: "/grave admin recover <player>", description: "Administratively recovers a player's graves."}
    - {section: configuration, category: admin, command: "/emsichill homes limit <amount>", description: "Changes the default home limit."}
    - {section: configuration, category: admin, command: "/emsichill rtp cooldown <minutes>", description: "Changes the global RTP cooldown."}
    - {section: configuration, category: admin, command: "/deathcontrol default <grave|keep|drop>", description: "Changes the default death mode."}
    - {section: configuration, category: admin, command: "/deathcontrol <player> <grave|keep|drop>", description: "Changes a player's death mode."}
    - {section: configuration, category: admin, command: "/auth reload", description: "Reloads the authentication module."}
    - {section: configuration, category: admin, command: "/emsichill rp reload", description: "Rebuilds local resource packs for the next player connection."}
    - {section: configuration, category: admin, command: "/emsichill rp push", description: "Forces the active packs onto online players and may interrupt their game."}
    - {section: configuration, category: admin, command: "/emsichill update check", description: "Checks for a new Release without installing it."}
    - {section: configuration, category: admin, command: "/emsichill update changes <version>", description: "Shows a short in-game summary of Release notes."}
    - {section: configuration, category: admin, command: "/emsichill update install <version>", description: "Downloads, validates and stages a Release when installs are enabled."}
    - {section: configuration, category: admin, command: "/emsichill update ignore <version>", description: "Hides automatic notices for a specific Release."}
    - {section: configuration, category: admin, command: "/emsichill update paper check", description: "Checks whether PaperMC published a new Paper/Minecraft build."}
    - {section: configuration, category: admin, command: "/emsichill update paper download <version> <build>", description: "Downloads and verifies a new Paper build for the next restart."}
    - {section: configuration, category: admin, command: "/emsichill update paper ignore <version> <build>", description: "Hides automatic notices for a specific Paper build."}
    - {section: configuration, category: admin, command: "/emsichill reload", description: "Reloads plugin configuration."}
    - {section: configuration, category: admin, command: "/emsichill status", description: "Shows module status."}
    - {section: configuration, category: admin, command: "/emsichill inspect", description: "Checks data and configuration for problems."}
    - {section: configuration, category: admin, command: "/emsichill backup", description: "Creates a data backup."}
    - {section: configuration, category: admin, command: "/emsichill migrate", description: "Saves and normalizes current data."}
    - {section: configuration, category: admin, command: "/emsichill help <category>", description: "Shows generated help by category."}
