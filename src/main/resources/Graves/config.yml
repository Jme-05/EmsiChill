inventory-loss:
  # grave: creates a protected grave; keep: keeps the full inventory; drop: uses vanilla drops.
  default-mode: grave

graves:
  lifetime-minutes: 30
  private-minutes: 5
  # Maximum horizontal and vertical distance used to find a safe chest location.
  marker-search-radius: 6
  marker-vertical-radius: 4
  name-display:
    enabled: true
    height: 1.45
    text: "Grave of {player}"
  visuals:
    effects: true
    locate-marker: true
    locate-marker-seconds: 8
  # drop leaves items in the world; delete removes them.
  on-expire: drop
