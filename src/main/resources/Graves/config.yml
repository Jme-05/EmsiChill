inventory-loss:
  # grave: creates a protected grave; keep: keeps the full inventory; drop: uses vanilla drops.
  default-mode: grave

graves:
  lifetime-minutes: 30
  private-minutes: 5
  # Horizontal search radius and nearby vertical range. Air deaths also search downward for solid ground.
  marker-search-radius: 6
  marker-vertical-radius: 4
  # Legacy text display options kept for compatibility.
  name-display:
    enabled: true
    height: 1.58
    text: "{player}"
  visuals:
    effects: true
    locate-marker: true
    locate-marker-seconds: 8
    marker:
      enabled: true
      style-version: 3
      title-height: 1.58
      title-scale: 0.5
      title: "{player}"
      base: true
      base-material: "POLISHED_DEEPSLATE"
      step: true
      step-material: "DEEPSLATE_TILES"
      headstone: true
      headstone-material: "DEEPSLATE_BRICKS"
      trim-material: "POLISHED_BLACKSTONE"
      plaque: true
      plaque-material: "CHISELED_DEEPSLATE"
      soul-lantern: true
      soul-lantern-material: "SOUL_LANTERN"
  # drop leaves items in the world; delete removes them.
  on-expire: drop
