teleport:
  default-delay-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

home:
  delay-seconds: 0
back:
  delay-seconds: 0
  save-death-location: true
tpa:
  delay-seconds: 3
  request-timeout-seconds: 30

rtp:
  delay-seconds: 3
  # 30 minutes for normal players. OPs bypass it through permission.
  cooldown-seconds: 1800
  minimum-radius: 500
  maximum-radius: 5000
  maximum-attempts: 25
  use-world-border-center: true
  # In the Nether, caves are searched only in this vertical range, never on the bedrock roof.
  nether-minimum-y: 8
  nether-maximum-y: 120
  # An empty list allows the current world. Add world names to restrict it.
  allowed-worlds: []
