_meta:
  limit-revision: 1

claims:
  # Number of regions each player can own without special permissions.
  default-limit: 2
  # Minimum distance between a new region and regions owned by other players.
  minimum-distance-blocks: 16

purchases:
  # /region build buys extra slots; it does not claim land automatically.
  enabled: true
  base-cost-emeralds: 64
  cost-multiplier: 2
  maximum-extra-slots: 6

# Each radius is measured from the center block to north, south, east and west.
# That means a radius of 32 protects 65 x 65 blocks: 32 + center + 32.
# To preserve older configurations, the key "size" is also accepted.
upgrades:
  - radius: 32
    cost-diamonds: 0
  - radius: 64
    cost-diamonds: 20
  - radius: 128
    cost-diamonds: 64

view:
  # How long /region view draws the border and center particles.
  duration-seconds: 10
  # Distance between horizontal border particles.
  border-spacing-blocks: 2
  # Distance between vertical pillars that make the border more visible.
  pillar-spacing-blocks: 8
  pillar-height-blocks: 6
