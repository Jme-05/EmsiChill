# Use /emsichill reload to apply changes.
settings:
  login-timeout-seconds: 60
  max-login-attempts: 5
  login-lockout-seconds: 30
  min-password-length: 6
  max-password-length: 64
  # Only affects new passwords. Values below 210000 are not recommended.
  password-hash-iterations: 210000

sessions:
  # Enables temporary session restore for a valid returning player.
  enabled: false
  duration-minutes: 30
  # Generated automatically. Do not share it: it signs the player's address fingerprint.
  address-secret: ""

visibility:
  # Hides unauthenticated players from the world and TAB list.
  hide-until-authenticated: true

authentication-location:
  enabled: false
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

blocking:
  movement: true
  teleport: true
  chat: true
  commands: true
  command-suggestions: true
  interaction: true
  inventory: true
  item-drop: true
  item-pickup: true
  damage: true
  allowed-commands:
    - login
    - l
    - register
    - reg
